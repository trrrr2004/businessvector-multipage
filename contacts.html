<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Контакты — БизнесВектор</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">Бизнес<span>Вектор</span></a>
      <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="mainNav">Меню</button>
      <nav class="main-nav" id="mainNav" aria-label="Основное меню">
        <a href="index.html">Главная</a>
        <a href="services.html">Услуги</a>
        <a href="cases.html">Кейсы</a>
        <a href="about.html">О компании</a>
        <a href="faq.html">Вопросы</a>
        <a href="contacts.html" class="active" aria-current="page">Контакты</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-head">
      <div class="container">
        <h1>Контакты</h1>
        <p class="lead">Адрес, телефон и почта не указаны: компания вымышленная.</p>
      </div>
    </section>
    <section class="section">
      <div class="container narrow">
        <p class="warning" role="note"><strong>Демонстрационная форма — данные не отправляются.</strong></p>
        <form id="contactForm" class="glass" novalidate>
          <label for="name">Имя</label>
          <input id="name" name="name" type="text" autocomplete="name">
          <p class="error" id="nameError" role="alert"></p>

          <label for="email">Электронная почта</label>
          <input id="email" name="email" type="email" autocomplete="email">
          <p class="error" id="emailError" role="alert"></p>

          <label for="message">Сообщение</label>
          <textarea id="message" name="message" rows="4"></textarea>
          <p class="error" id="messageError" role="alert"></p>

          <button class="btn" type="submit">Отправить</button>
          <p class="notice" id="formNotice" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© «БизнесВектор» — вымышленная компания для учебного проекта.</p>
      <p><a href="index.html">Главная</a> · <a href="services.html">Услуги</a> · <a href="contacts.html">Контакты</a></p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
